name: 构建 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }

      - name: 准备 www
        run: |
          mkdir -p www && cp index.html manifest.json sw.js www/
          cp -r js css data www/
          rm -rf www/scripts/requirements.txt www/scripts/scraper.js www/scripts/scraper.py

      - name: 安装 Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 生成 Android 项目
        run: npx cap add android && npx cap sync android

      - name: 设置 local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: 编译 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 废品行情通
          path: android/app/build/outputs/apk/debug/app-debug.apk
