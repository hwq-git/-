name: 构建 APK

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 准备 www 目录
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp -r js css data www/
          rm -rf www/scripts/requirements.txt www/scripts/scraper.js www/scripts/scraper.py

      - name: 安装 Capacitor
        run: |
          npm install --save-dev @capacitor/cli @capacitor/android

      - name: 构建 Android 项目
        run: |
          npx cap add android
          npx cap sync android

      - name: 编译 APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 废品行情通-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
