name: 构建 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }

      - uses: android-actions/setup-android@v3
  
      - name: 准备 www
        run: |
          mkdir -p www && cp index.html manifest.json sw.js www/
          cp -r js css data www/
          rm -rf www/scripts/requirements.txt www/scripts/scraper.py

      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android && npx cap sync android
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 编译 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: 废品行情通
          path: android/app/build/outputs/apk/debug/app-debug.apk
