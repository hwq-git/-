name: 定时抓取废品价格

on:
  schedule:
    # 每天 8:00, 12:00, 16:00, 20:00 (北京时间)
    - cron: '0 0,4,8,12 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          cd scripts
          npm init -y > /dev/null 2>&1
          npm install axios cheerio --save

      - name: 运行爬虫
        run: node scripts/scraper.js

      - name: 提交更新的价格数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scraped-prices.json
          git diff --staged --quiet || git commit -m "chore: 自动更新废品价格 [skip ci]"
          git push
